name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit Tests (all modules)
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: android/*/build/reports/tests/
          if-no-files-found: ignore

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detekt
        run: ./gradlew --no-daemon --console=plain detekt

      - name: Android Lint
        run: ./gradlew --no-daemon --console=plain :app:lintDebug

      - name: Upload lint reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lint-reports
          path: |
            android/app/build/reports/lint-results-*.html
            build/reports/detekt/*.html
          if-no-files-found: ignore

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-tests, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug

      - name: Build Release APK
        run: ./gradlew --no-daemon --console=plain :app:assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: MrComic-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: MrComic-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release mapping
        uses: actions/upload-artifact@v7
        with:
          name: MrComic-release-mapping
          path: android/app/build/outputs/mapping/release/*
          if-no-files-found: ignore

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [unit-tests]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ./gradlew --no-daemon --console=plain connectedDebugAndroidTest

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: instrumented-test-results
          path: android/*/build/reports/androidTests/
          if-no-files-found: ignore
