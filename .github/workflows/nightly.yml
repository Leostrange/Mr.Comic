name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-home-cache-cleanup: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Detekt
        run: ./gradlew --no-daemon --console=plain detekt

      - name: Unit Tests
        run: ./gradlew --no-daemon --console=plain testDebugUnitTest

      - name: Android Lint
        run: ./gradlew --no-daemon --console=plain :app:lintDebug

      - name: Build Debug APK
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-test-results
          path: android/*/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nightly-lint-reports
          path: |
            android/app/build/reports/lint-results-*.html
            build/reports/detekt/*.html
          if-no-files-found: ignore

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Nightly CI failed — ' + new Date().toISOString().slice(0, 10),
              body: 'Nightly CI run failed. See [workflow run](' +
                `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}` +
                ') for details.',
              labels: ['bug', 'ci']
            });
