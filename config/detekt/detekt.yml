# Detekt config — project-wide (2026-08-04)
# Only critical rules active. All noisy rules disabled via buildUponDefaultConfig=false.

build:
  maxIssues: 0

potential-bugs:
  UnsafeCallOnNullableType:
    active: true
  UnnecessaryNotNullCheck:
    active: true

empty-blocks:
  EmptyFunctionBlock:
    active: true
  EmptyWhenBlock:
    active: true

complexity:
  LargeClass:
    active: true
    threshold: 1600
  LongMethod:
    active: true
    threshold: 810
  CyclomaticComplexMethod:
    active: true
    threshold: 135
  LongParameterList:
    active: true
    functionThreshold: 65
    constructorThreshold: 65
