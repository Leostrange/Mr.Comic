[versions]
# Android Gradle Plugin and Kotlin
agp = "8.1.4"
kotlin = "1.9.24"
kotlinCompilerExtension = "1.5.14"
hilt = "2.48"
ksp = "1.9.24-1.0.20"

# SDK Versions
compileSdk = "34"
minSdk = "26"  # Changed from 21 to 26 for adaptive-icon support
targetSdk = "34"
buildTools = "34.0.0"
jvmTarget = "17"

# AndroidX Core
androidx-core-ktx = "1.12.0"
androidx-collection = "1.4.0"
documentfile = "1.0.1"
appcompat = "1.6.1"

# Lifecycle
lifecycle = "2.7.0"

# Activity & Splash
activity-compose = "1.8.2"
splashscreen = "1.0.1"

# Compose
compose-bom = "2024.02.00"
lottie = "6.3.0"
constraintlayout = "1.0.1"
accompanist = "0.32.0"
palette = "1.0.0"
glide = "4.16.0"

# Navigation
navigation = "2.7.7"
hilt-navigation-compose = "1.2.0"

# Networking
retrofit = "2.9.0"
okhttp = "4.12.0"
gson = "2.10.1"

# Room Database
room = "2.6.1"

# DataStore
datastore = "1.0.0"

# Coil
coil = "2.5.0"

# Material
material = "1.11.0"

# Archive support
zip4j = "2.11.5"
junrar = "7.5.5"
commons-compress = "1.26.0"

# PDF support
# Using pdfbox-android from Maven Central (Tom Roush's fork)
pdfium = "2.0.27.0"

# EPUB support - REMOVED (no available libraries on Maven Central)
# epublib = "3.0"

# Media3
media3 = "1.2.1"

# Apache PDF
apache-pdfbox = "3.0.2"
apache-fontbox = "3.0.2"
commons-logging = "1.3.0"

# Coroutines
kotlinx-coroutines-android = "1.8.0"

# Cloud services
google-play-services-auth = "20.7.0"
microsoft-identity-client = "4.9.0"
microsoft-graph = "5.77.0"
google-api-client-android = "2.2.0"
google-api-services-drive = "v3-rev20220815-2.0.0"

# ML Kit
mlkit = "16.0.0"

# Testing
junit = "4.13.2"
androidx-junit = "1.1.5"
espresso = "3.5.1"
mockk = "1.13.9"

[libraries]
# AndroidX Core
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-collection-ktx = { group = "androidx.collection", name = "collection-ktx", version.ref = "androidx-collection" }
documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

# Lifecycle
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Activity & Splash
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity-compose" }
androidx-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

# Compose BOM
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material3-window-size = { group = "androidx.compose.material3", name = "material3-window-size-class" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# UI Components
lottie-compose = { group = "com.airbnb.android", name = "lottie-compose", version.ref = "lottie" }
constraintlayout-compose = { group = "androidx.constraintlayout", name = "constraintlayout-compose", version.ref = "constraintlayout" }
accompanist-systemuicontroller = { group = "com.google.accompanist", name = "accompanist-systemuicontroller", version.ref = "accompanist" }
accompanist-adaptive = { group = "com.google.accompanist", name = "accompanist-adaptive", version.ref = "accompanist" }
accompanist-permissions = { group = "com.google.accompanist", name = "accompanist-permissions", version.ref = "accompanist" }
androidx-palette = { group = "androidx.palette", name = "palette", version.ref = "palette" }
glide-core = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigation" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hilt-navigation-compose" }

# Networking
retrofit-core = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging-interceptor = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
google-gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }

# Hilt DI
google-hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
google-hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# Room Database
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# DataStore
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Coil
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }

# Material
material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# Archive support
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
junrar = { group = "com.github.junrar", name = "junrar", version.ref = "junrar" }
commons-compress = { group = "org.apache.commons", name = "commons-compress", version.ref = "commons-compress" }

# PDF support
# Using pdfbox-android from Maven Central (Tom Roush's fork)
pdfium-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfium" }

# EPUB support - REMOVED (no available libraries on Maven Central)
# epublib-core = { group = "nl.siegmann.epublib", name = "epublib-core", version.ref = "epublib" }

# Media3
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }

# Apache PDF
apache-pdfbox = { group = "org.apache.pdfbox", name = "pdfbox", version.ref = "apache-pdfbox" }
apache-fontbox = { group = "org.apache.pdfbox", name = "fontbox", version.ref = "apache-fontbox" }
commons-logging = { group = "commons-logging", name = "commons-logging", version.ref = "commons-logging" }

# Coroutines
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "kotlinx-coroutines-android" }

# Cloud services
google-play-services-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "google-play-services-auth" }
microsoft-identity-client = { group = "com.microsoft.identity.client", name = "msal", version.ref = "microsoft-identity-client" }
microsoft-graph = { group = "com.microsoft.graph", name = "microsoft-graph", version.ref = "microsoft-graph" }
google-api-client-android = { group = "com.google.api-client", name = "google-api-client-android", version.ref = "google-api-client-android" }
google-api-services-drive = { group = "com.google.apis", name = "google-api-services-drive", version.ref = "google-api-services-drive" }

# ML Kit
mlkit-text-recognition = { group = "com.google.mlkit", name = "text-recognition", version.ref = "mlkit" }

# Testing
test-junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-junit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
test-mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
test-kotlinx-coroutines = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinx-coroutines-android" }

[bundles]
room = ["androidx-room-runtime", "androidx-room-ktx"]
compose = [
    "androidx-compose-ui",
    "androidx-compose-material3",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material-icons-extended"
]
test-unit = [
    "test-junit",
    "test-mockk",
    "test-kotlinx-coroutines"
]

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
